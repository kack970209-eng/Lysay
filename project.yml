name: Lysay
options:
  bundleIdPrefix: com.lysay
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "NO"

targets:
  Lysay:
    type: application
    platform: iOS
    sources:
      - path: Lysay
      - path: Shared
      - path: Engine
      - path: Vendor
        excludes:
          - "SHERPA_ONNX_LICENSE"
      - path: Resources/OpenCC
        type: folder
        buildPhase: resources
      - path: Resources/Models
        type: folder
        buildPhase: resources
    dependencies:
      - target: LysayKeyboard
        embed: true
      - framework: Frameworks/SherpaOnnxC.xcframework
        embed: true
        codeSign: false
      - framework: Frameworks/llama.xcframework
        embed: true
        codeSign: false
    info:
      path: Lysay/Info.plist
      properties:
        CFBundleDisplayName: Lysay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: Lysay 需要使用麦克风进行语音输入，所有语音都只在本机离线识别，不会上传。
        CFBundleURLTypes:
          - CFBundleURLName: com.lysay.app
            CFBundleURLSchemes:
              - lysay
        ITSAppUsesNonExemptEncryption: false
        LysayAPIBase: https://lysay-api.kack970209.workers.dev
        LysayGoogleClientID: $(LYSAY_GOOGLE_CLIENT_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lysay.app
        PRODUCT_NAME: Lysay
        CODE_SIGN_ENTITLEMENTS: Lysay/Lysay.entitlements
        LYSAY_GOOGLE_CLIENT_ID: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

  LysayKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: LysayKeyboard
      - path: Shared
      - path: Resources/Zhuyin
        type: folder
        buildPhase: resources
    info:
      path: LysayKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Lysay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lysay.app.keyboard
        PRODUCT_NAME: LysayKeyboard
        APPLICATION_EXTENSION_API_ONLY: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
