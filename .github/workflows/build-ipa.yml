name: Build IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "接文档/**"
      - ".github/workflows/zhuyin-data.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  SHERPA_VERSION: "1.13.8"
  STREAMING_REPO: "csukuangfj/sherpa-onnx-streaming-paraformer-bilingual-zh-en"
  QWEN3_MODEL: "sherpa-onnx-qwen3-asr-0.6B-int8-2026-03-25"
  LLAMA_BUILD: "b11829"
  LLM_URL: "https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore model cache
        id: cache-models
        uses: actions/cache/restore@v4
        with:
          path: Resources/Models
          key: models-v2-paraformer-bilingual-int8-${{ env.QWEN3_MODEL }}-qwen3-0.6b-q8

      - name: Download streaming model (Paraformer int8)
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p Resources/Models/streaming
          for f in encoder.int8.onnx decoder.int8.onnx tokens.txt; do
            curl -fSL --retry 3 -o "Resources/Models/streaming/$f" \
              "https://huggingface.co/${STREAMING_REPO}/resolve/main/$f"
          done
          ls -la Resources/Models/streaming

      - name: Download refine model (Qwen3-ASR 0.6B int8)
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/qwen && cd /tmp/qwen
          curl -fSL --retry 3 -o model.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/${QWEN3_MODEL}.tar.bz2"
          tar xjf model.tar.bz2
          rm model.tar.bz2
          echo "---- model contents ----"
          find "${QWEN3_MODEL}" -maxdepth 2 | head -50
          cd "$GITHUB_WORKSPACE"
          mkdir -p Resources/Models/qwen3
          src="/tmp/qwen/${QWEN3_MODEL}"
          cp "$src/conv_frontend.onnx" "$src/encoder.int8.onnx" "$src/decoder.int8.onnx" Resources/Models/qwen3/
          cp -R "$src/tokenizer" Resources/Models/qwen3/
          du -sh Resources/Models/*

      - name: Download AI polish model (Qwen3-0.6B Q8_0)
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p Resources/Models/llm
          curl -fSL --retry 3 -o Resources/Models/llm/qwen3-0.6b-q8_0.gguf "$LLM_URL"
          ls -la Resources/Models/llm

      - name: Save model cache
        if: steps.cache-models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Resources/Models
          key: models-v2-paraformer-bilingual-int8-${{ env.QWEN3_MODEL }}-qwen3-0.6b-q8

      - name: Download frameworks (sherpa-onnx, llama.cpp)
        run: |
          set -euo pipefail
          mkdir -p Frameworks && cd Frameworks
          curl -fSL --retry 3 -o sherpa.zip \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/xcframework/sherpa-onnx-v${SHERPA_VERSION}-ios-shared-onnxruntime-static.xcframework.zip"
          unzip -q sherpa.zip && rm sherpa.zip
          curl -fSL --retry 3 -o llama.zip             "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_BUILD}/llama-${LLAMA_BUILD}-xcframework.zip"
          unzip -q llama.zip && rm llama.zip
          mv build-apple/llama.xcframework . && rm -rf build-apple
          ls -la

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild \
            -project Lysay.xcodeproj \
            -target Lysay \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            MARKETING_VERSION="1.0.${{ github.run_number }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            LYSAY_GOOGLE_CLIENT_ID="${{ vars.GOOGLE_IOS_CLIENT_ID }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*(deprecated)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/Release-iphoneos/Lysay.app"
          ls -la "$APP" "$APP/PlugIns" "$APP/Frameworks"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          # 临时签名并写入 Sign in with Apple 权限，签名工具重签时可沿用
          A="Payload/Lysay.app"
          for f in "$A"/Frameworks/*.framework; do codesign --force --sign - "$f"; done
          codesign --force --sign - "$A/PlugIns/LysayKeyboard.appex"
          codesign --force --sign - --entitlements Lysay/Lysay.adhoc.entitlements "$A"
          codesign -d --entitlements - "$A" || true
          IPA="Lysay-1.0.${{ github.run_number }}-unsigned.ipa"
          zip -qry "$IPA" Payload
          ls -lh "$IPA"
          echo "IPA=$IPA" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" "$IPA" \
            --title "Lysay 1.0.${{ github.run_number }}" \
            --notes "未签名 IPA，请用签名工具重签后安装。提交：${{ github.sha }}"
