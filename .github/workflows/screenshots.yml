name: App Store screenshots

# 在 iPhone 17 Pro Max 模拟器（6.9 吋，1320×2868）里用示范模式截图
on:
  workflow_dispatch:

env:
  SHERPA_VERSION: "1.13.8"

jobs:
  shots:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download sherpa-onnx framework
        run: |
          set -euo pipefail
          mkdir -p Frameworks && cd Frameworks
          curl -fSL --retry 3 -o sherpa.zip "https://github.com/k2-fsa/sherpa-onnx/releases/download/xcframework/sherpa-onnx-v${SHERPA_VERSION}-ios-shared-onnxruntime-static.xcframework.zip"
          unzip -q sherpa.zip && rm sherpa.zip

      - name: Generate Xcode project (without llama.cpp, no simulator slice)
        run: |
          python3 - <<'PY'
          import re
          p = "project.yml"
          s = open(p, encoding="utf-8").read()
          s = re.sub(r"      - framework: Frameworks/llama\.xcframework\n        embed: true\n        codeSign: true\n", "", s)
          open(p, "w", encoding="utf-8").write(s)
          PY
          grep -c llama project.yml || true
          brew install xcodegen
          xcodegen generate

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project Lysay.xcodeproj -scheme Lysay -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build \
            | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Take screenshots
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products -name "Lysay.app" -maxdepth 3 | head -1)
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import sys,json; r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='iOS' and x['isAvailable']]; print(r[-1]['identifier'])")
          echo "runtime $RUNTIME"
          DEV=$(xcrun simctl create shots "iPhone 17 Pro Max" "$RUNTIME")
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl status_bar "$DEV" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularMode active --cellularBars 4 --wifiBars 3
          xcrun simctl install "$DEV" "$APP"
          mkdir -p shots
          for appearance in light dark; do
            xcrun simctl ui "$DEV" appearance "$appearance"
            for mode in voice polish zhuyin clipboard home pro; do
              xcrun simctl launch "$DEV" com.lysay.app -LysayDemo "$mode"
              sleep 6
              xcrun simctl io "$DEV" screenshot "shots/${appearance}-${mode}.png"
              xcrun simctl terminate "$DEV" com.lysay.app || true
              sleep 1
            done
          done
          ls -la shots

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shots-build-log
          path: build.log
          if-no-files-found: ignore
